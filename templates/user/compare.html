{% extends "user/layout.html" %}
{% block content %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<h4 class="mt-4">动态路径检查记录</h4>
<div class="row">
    {% for item in dynamic_results %}
    <div class="col-md-4 mb-3">
        <div class="card result-card h-100" style="cursor:pointer; transition:0.3s;"
             data-detail='{{ item | tojson | safe }}'>
            <div class="card-body">
                <h5 class="card-title">智能体动态检测</h5>
                <p class="card-text">
                    结果：
                    <span class="badge {% if item.result == '发现风险' %}bg-danger{% else %}bg-success{% endif %}">
                        {{ item.result if item.result else '安全' }}
                    </span>
                </p>
                <p class="text-muted small">{{ item['检测时间戳'] if item['检测时间戳'] else '无时间' }}</p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

<!-- 检测详情 + 时间对比柱状图 -->
<div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">检测详情 & 红队方法时间对比</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <!-- 左侧详情 -->
                    <div class="col-md-5">
                        <div class="mb-3">
                            <label class="form-label fw-bold">检测时间戳</label>
                            <div class="form-control" id="m_time">-</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">SAT 花费时间</label>
                            <div class="form-control text-success fw-bold" id="m_cost">-</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">红队检测时间</label>
                            <div class="form-control" id="m_red">-</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">检测结果</label>
                            <div class="form-control" id="m_result">-</div>
                        </div>
                    </div>

                    <!-- 右侧柱状图 -->
                    <div class="col-md-7">
                        <h5 class="text-primary mb-3">红队检测方法时间开销对比</h5>
                        <div style="height: 320px;">
                            <canvas id="compareChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let chartInstance = null;

document.addEventListener('DOMContentLoaded', function () {
    const cards = document.querySelectorAll('.result-card');
    cards.forEach(card => {
        card.addEventListener('click', function () {
            try {
                const item = JSON.parse(this.dataset.detail);
                showDetailAndChart(item);
            } catch (e) {
                console.error("数据错误", e);
            }
        });
    });
});

function showDetailAndChart(item) {
    // 填充详情
    document.getElementById('m_time').innerText = item['检测时间戳'] || '未记录';
    document.getElementById('m_cost').innerText = item['花费时间'] || '未记录';
    document.getElementById('m_red').innerText = item['红队检测时间'] || '未记录';
    
    const res = item.result || '安全';
    const resHtml = `<span class="badge ${res === '发现风险' ? 'bg-danger' : 'bg-success'}">${res}</span>`;
    document.getElementById('m_result').innerHTML = resHtml;

    // 取出 SAT 真实时间
    let satTime = parseFloat(item['花费时间']) || 1.2;

    // 其他方法假数据（比 SAT 慢）
    const methodData = {
        labels: ['SAT', 'ToolCommander', 'AutoCMD', 'InjectAgent'],
        datasets: [{
            label: '检测时间开销（秒）',
            data: [satTime, satTime * 2.8, satTime * 3.5, satTime * 4.2],
            backgroundColor: [
                '#28a745',
                '#007bff',
                '#ffc107',
                '#dc3545'
            ],
            borderWidth: 1
        }]
    };

    const ctx = document.getElementById('compareChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(ctx, {
        type: 'bar',
        data: methodData,
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: true, position: 'top' },
                title: { text: '红队方法效率对比', display: true }
            },
            scales: {
                y: { beginAtZero: true, title: { display: true, text: '秒' } }
            }
        }
    });

    new bootstrap.Modal(document.getElementById('detailModal')).show();
}
</script>
{% endblock %}
