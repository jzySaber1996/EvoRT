{% extends "user/layout.html" %}
{% block content %}
<h3>程序代码智能体运行时安全检查</h3>
<div class="card mt-3 p-3">
    <form id="code-monitor-form" class="mb-3">
        <div class="mb-2">
            <label for="scenario" class="form-label">选择代码智能体任务</label>
            <select class="form-select" id="scenario" required>
                <option value="log_cleanup">日志清理代码生成</option>
                <option value="data_analysis">本地数据分析代码生成</option>
            </select>
        </div>
        <div class="mb-2">
            <label for="taskText" class="form-label">输入任务文本</label>
            <input type="text" class="form-control" id="taskText" placeholder="如：帮我清理服务器日志并保留审计证据" required>
        </div>
        <button type="submit" class="btn btn-primary" id="startCodeMonitor">开始代码运行时检查</button>
    </form>

    <div id="runtime-summary" class="row g-2 mb-3" style="display:none;">
        <div class="col-md-4">
            <div class="border rounded p-2 bg-light">
                <div class="text-muted small">已检查步骤</div>
                <div class="fs-5 fw-bold" id="summary-steps">0</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="border rounded p-2 bg-light">
                <div class="text-muted small">风险代码版本</div>
                <div class="fs-5 fw-bold text-danger" id="summary-risk">0</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="border rounded p-2 bg-light">
                <div class="text-muted small">UNSAT 约束</div>
                <div class="fs-5 fw-bold text-warning" id="summary-unsat">0</div>
            </div>
        </div>
    </div>

    <div id="code-monitor-steps" class="mt-4"></div>
    <div id="code-chain-btn-area" class="mt-4" style="display:none;">
        <button class="btn btn-success" id="showCodeChainBtn">代码执行链路</button>
    </div>
    <div id="code-chain-tree-area" class="mt-4" style="display:none;">
        <h5>代码智能体运行时链路可视化</h5>
        <div class="d-flex gap-3 flex-wrap mb-2 small">
            <span><span class="legend-dot bg-primary"></span>正常步骤</span>
            <span><span class="legend-dot bg-danger"></span>风险代码/UNSAT</span>
            <span><span class="legend-dot bg-success"></span>回滚后安全分支</span>
            <span><span class="legend-line"></span>回滚关系</span>
        </div>
        <div id="code-tree-container" style="width:100%; min-height:620px; height:820px; overflow:auto;"></div>
    </div>
</div>

<div class="modal fade" id="codeDetailModal" tabindex="-1" aria-labelledby="codeDetailModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="codeDetailModalLabel">代码运行时检查详情</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
      </div>
      <div class="modal-body" id="codeDetailBody"></div>
    </div>
  </div>
</div>

<style>
.code-snippet {
    max-height: 210px;
    overflow: auto;
    background: #111827;
    color: #e5e7eb;
    border-radius: 6px;
    padding: 12px;
    font-size: 13px;
    line-height: 1.45;
}
.detail-code {
    max-height: 420px;
    overflow: auto;
    background: #111827;
    color: #e5e7eb;
    border-radius: 6px;
    padding: 14px;
    font-size: 13px;
    line-height: 1.5;
}
.legend-dot {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: -1px;
}
.legend-line {
    display: inline-block;
    width: 26px;
    border-top: 3px dashed #dc3545;
    margin-right: 4px;
    vertical-align: 3px;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
let codeChainHistory = [];

function escapeHtml(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function badgeClass(check) {
    if (check.includes('高风险')) return 'bg-danger';
    if (check === '回滚') return 'bg-warning text-dark';
    return 'bg-success';
}

function constraintSummary(step) {
    const constraints = step.constraints || [];
    const unsat = constraints.filter(item => item.result === 'UNSAT').length;
    if (constraints.length === 0) return '无约束求解项';
    return `${constraints.length} 条约束，${unsat} 条 UNSAT`;
}

function updateSummary() {
    const riskCount = codeChainHistory.filter(step => step.check.includes('高风险')).length;
    const unsatCount = codeChainHistory.reduce((total, step) => {
        return total + (step.constraints || []).filter(item => item.result === 'UNSAT').length;
    }, 0);
    document.getElementById('runtime-summary').style.display = '';
    document.getElementById('summary-steps').textContent = codeChainHistory.length;
    document.getElementById('summary-risk').textContent = riskCount;
    document.getElementById('summary-unsat').textContent = unsatCount;
}

function printCodeStep(step, idx) {
    const cardId = `code-step-card-${idx}`;
    const codePreview = escapeHtml((step.code || '').split('\n').slice(0, 6).join('\n'));
    const stepHtml = `
    <div class="card mb-3 code-step-card" id="${cardId}" style="cursor:pointer;" data-idx="${idx}">
        <div class="card-body">
            <div class="d-flex align-items-start gap-2 flex-wrap">
                <span class="badge bg-secondary">${idx + 1}</span>
                <div class="flex-grow-1">
                    <div class="d-flex align-items-center gap-2 flex-wrap">
                        <strong>${escapeHtml(step.tool)}</strong>
                        <span class="text-muted small">${escapeHtml(step.agent || '')}</span>
                        <span class="badge ${badgeClass(step.check)} ms-auto">${escapeHtml(step.check)}</span>
                    </div>
                    <div class="mt-1">${escapeHtml(step.desc)}</div>
                    <div class="mt-2 small text-muted">${constraintSummary(step)}</div>
                    <pre class="code-snippet mt-2 mb-0"><code>${codePreview}</code></pre>
                </div>
            </div>
        </div>
    </div>
    `;
    document.getElementById('code-monitor-steps').insertAdjacentHTML('beforeend', stepHtml);
    setTimeout(() => {
        document.getElementById(cardId).onclick = function() {
            showCodeDetail(step);
        };
    }, 100);
}

function showCodeDetail(step) {
    let html = `
        <div class="row g-3">
            <div class="col-md-6">
                <div><strong>智能体：</strong>${escapeHtml(step.agent || '-')}</div>
                <div class="mt-2"><strong>工具名称：</strong>${escapeHtml(step.tool)}</div>
                <div class="mt-2"><strong>检查结果：</strong><span class="badge ${badgeClass(step.check)}">${escapeHtml(step.check)}</span></div>
                <div class="mt-3"><strong>输入参数：</strong><pre>${escapeHtml(JSON.stringify(step.input, null, 2))}</pre></div>
                <div class="mt-3"><strong>输出结果：</strong><pre>${escapeHtml(JSON.stringify(step.output, null, 2))}</pre></div>
            </div>
            <div class="col-md-6">
                <strong>运行时代码：</strong>
                <pre class="detail-code mt-2"><code>${escapeHtml(step.code || '')}</code></pre>
            </div>
        </div>
    `;

    if (step.constraints && step.constraints.length > 0) {
        html += `<div class="mt-3"><strong>约束求解结果：</strong><div class="table-responsive mt-2"><table class="table table-sm table-bordered align-middle"><thead><tr><th>规则</th><th>公式</th><th>结果</th><th>证据</th></tr></thead><tbody>`;
        step.constraints.forEach(rule => {
            html += `<tr>
                <td>${escapeHtml(rule.id)}</td>
                <td><code>${escapeHtml(rule.formula)}</code></td>
                <td><span class="badge ${rule.result === 'SAT' ? 'bg-success' : 'bg-danger'}">${escapeHtml(rule.result)}</span></td>
                <td>${escapeHtml(rule.evidence || '')}</td>
            </tr>`;
        });
        html += `</tbody></table></div></div>`;
    }

    document.getElementById('codeDetailBody').innerHTML = html;
    const modal = new bootstrap.Modal(document.getElementById('codeDetailModal'));
    modal.show();
}

function buildCodeChainTree(history) {
    let root = null;
    let cur = null;
    let lastRiskNode = null;
    let recoveryMode = false;
    const nodesByTool = new Map();
    const rollbackLinks = [];

    function rememberNode(step, node) {
        if (!nodesByTool.has(step.tool)) {
            nodesByTool.set(step.tool, []);
        }
        nodesByTool.get(step.tool).push(node);
    }

    function findLastNodeByTool(toolName) {
        const nodes = nodesByTool.get(toolName);
        return nodes && nodes.length > 0 ? nodes[nodes.length - 1] : null;
    }

    history.forEach((step, i) => {
        if (step.check === '回滚') {
            const rollbackTargetTool = step.input && step.input.rollbackTo;
            const targetNode = findLastNodeByTool(rollbackTargetTool);
            if (targetNode) {
                rollbackLinks.push({
                    fromStepIndex: lastRiskNode ? lastRiskNode.stepIndex : (cur && cur.stepIndex),
                    toStepIndex: targetNode.stepIndex,
                    rollbackStepIndex: i
                });
                cur = targetNode;
                recoveryMode = true;
                lastRiskNode = null;
            }
            return;
        }

        const hasUnsat = (step.constraints || []).some(rule => rule.result === 'UNSAT');
        const isHighRisk = step.check && step.check.includes('高风险');
        const node = {
            name: step.tool,
            stepIndex: i,
            status: isHighRisk || hasUnsat ? 'risk' : (recoveryMode ? 'recovery' : 'normal'),
            children: []
        };

        if (!root) {
            root = node;
        } else if (cur) {
            cur.children.push(node);
        }

        rememberNode(step, node);
        cur = node;
        if (isHighRisk || hasUnsat) {
            lastRiskNode = node;
        }
    });

    return { root, rollbackLinks };
}

function drawCodeTree(treeData) {
    const container = document.getElementById('code-tree-container');
    container.innerHTML = '';
    if (!treeData.root) return;

    const width = 980;
    const height = 820;
    const tree = d3.tree().size([height - 220, width - 320]);
    const root = d3.hierarchy(treeData.root);
    tree(root);

    const svg = d3.create('svg')
        .attr('width', width)
        .attr('height', height)
        .style('font', '13px sans-serif');

    const g = svg.append('g').attr('transform', 'translate(160, 90)');
    const defs = svg.append('defs');

    function appendArrow(id, color, orient = 'auto') {
        defs.append('marker')
            .attr('id', id)
            .attr('viewBox', '0 -5 10 10')
            .attr('refX', 15)
            .attr('refY', 0)
            .attr('markerWidth', 6)
            .attr('markerHeight', 6)
            .attr('orient', orient)
            .append('path')
            .attr('d', 'M0,-5 L10,0 L0,5')
            .attr('fill', color);
    }

    appendArrow('code-arrow-blue', '#0d6efd');
    appendArrow('code-arrow-green', '#198754');
    appendArrow('code-arrow-red', '#dc3545');
    appendArrow('code-arrow-rollback', '#dc3545', 'auto-start-reverse');

    function colorByStatus(status) {
        if (status === 'risk') return '#dc3545';
        if (status === 'recovery') return '#198754';
        return '#0d6efd';
    }

    function markerByStatus(status) {
        if (status === 'risk') return 'url(#code-arrow-red)';
        if (status === 'recovery') return 'url(#code-arrow-green)';
        return 'url(#code-arrow-blue)';
    }

    g.append('g')
        .attr('fill', 'none')
        .attr('stroke-width', 2.5)
        .selectAll('path')
        .data(root.links())
        .join('path')
        .attr('stroke', d => colorByStatus(d.target.data.status))
        .attr('d', d3.linkVertical().x(d => d.x).y(d => d.y))
        .attr('marker-end', d => markerByStatus(d.target.data.status));

    treeData.rollbackLinks.forEach(link => {
        let fromNode = null;
        let targetNode = null;
        root.each(d => {
            if (d.data.stepIndex === link.fromStepIndex) fromNode = d;
            if (d.data.stepIndex === link.toStepIndex) targetNode = d;
        });
        if (fromNode && targetNode) {
            const sideOffset = fromNode.x >= targetNode.x ? 78 : -78;
            g.append('path')
                .attr('d', `M ${fromNode.x} ${fromNode.y} C ${fromNode.x + sideOffset} ${fromNode.y - 46}, ${targetNode.x + sideOffset} ${targetNode.y + 46}, ${targetNode.x} ${targetNode.y}`)
                .attr('stroke', '#dc3545')
                .attr('stroke-width', 3)
                .attr('stroke-dasharray', '8,4')
                .attr('fill', 'none')
                .attr('marker-end', 'url(#code-arrow-rollback)');
        }
    });

    const node = g.append('g')
        .selectAll('g')
        .data(root.descendants())
        .join('g')
        .attr('transform', d => `translate(${d.x},${d.y})`);

    node.append('circle')
        .attr('r', 17)
        .attr('fill', d => colorByStatus(d.data.status));

    node.append('text')
        .attr('dy', '0.35em')
        .attr('y', d => d.children ? -30 : 30)
        .attr('text-anchor', 'middle')
        .text(d => d.data.name)
        .style('font-weight', 'bold')
        .style('font-size', '12px');

    node.append('text')
        .attr('dy', '0.35em')
        .attr('y', 5)
        .attr('text-anchor', 'middle')
        .attr('fill', '#fff')
        .style('font-size', '11px')
        .style('font-weight', 'bold')
        .text(d => d.data.stepIndex + 1);

    container.appendChild(svg.node());
}

document.getElementById('code-monitor-form').addEventListener('submit', function(e) {
    e.preventDefault();
    document.getElementById('code-monitor-steps').innerHTML = '';
    document.getElementById('code-chain-btn-area').style.display = 'none';
    document.getElementById('code-chain-tree-area').style.display = 'none';
    document.getElementById('runtime-summary').style.display = 'none';
    codeChainHistory = [];

    let idx = 0;
    const scenario = document.getElementById('scenario').value;

    function nextStep() {
        fetch('/user/code_runtime_step', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({idx: idx, scenario: scenario})
        })
        .then(res => res.json())
        .then(data => {
            if (!data.finished) {
                printCodeStep(data.step, idx);
                codeChainHistory.push(data.step);
                updateSummary();
                idx++;
                setTimeout(nextStep, 900);
            } else {
                document.getElementById('code-chain-btn-area').style.display = '';
            }
        });
    }

    nextStep();
});

document.getElementById('showCodeChainBtn').onclick = function() {
    document.getElementById('code-chain-tree-area').style.display = '';
    const treeData = buildCodeChainTree(codeChainHistory);
    drawCodeTree(treeData);

    const riskCount = codeChainHistory.filter(step => step.check.includes('高风险')).length;
    const unsatCount = codeChainHistory.reduce((total, step) => total + (step.constraints || []).filter(rule => rule.result === 'UNSAT').length, 0);
    const checkResult = {
        "任务类型": "程序代码智能体运行时安全检查",
        "检测时间戳": new Date().toLocaleString('zh-CN'),
        "花费时间": "3.1s",
        "风险代码版本": riskCount,
        "UNSAT约束": unsatCount,
        "红队检测时间": new Date().toISOString()
    };

    fetch('/user/code_runtime', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(checkResult)
    });
};
</script>
{% endblock %}
