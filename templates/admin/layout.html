<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>管理员控制台</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar bg-danger navbar-dark px-4">
        <div class="container">
            <h5 class="text-white">管理员控制台</h5>
            <a href="/logout" class="btn btn-sm btn-outline-light">退出</a>

    </nav>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3">

                    <a href="/admin/history" class="list-group-item">检测历史</a>
                    <a href="/admin/compare" class="list-group-item">效果对比</a>

            </div>
            <div class="col-md-9">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
