{% extends "admin/layout.html" %}
{% block content %}
<h3>系统持续优化</h3>
<div class="card mt-3 p-3">
    <ul class="mb-3">
        <li>优化中间表示与约束规则库</li>
        <li>优化动态智能体FM约束生成器</li>
        <li>优化智能体运行时安全SMT求解器</li>
        <li>提升检测速度与准确率</li>
    </ul>
    <button class="btn btn-warning" id="startOptimizeBtn">执行优化</button>

    <!-- 下方进度与日志区域 -->
    <div class="mt-4 d-none" id="optArea">
        <div class="progress mb-3" style="height:26px;">
            <div id="optProgress" class="progress-bar progress-bar-striped progress-bar-animated bg-warning" 
                 role="progressbar" style="width:0%; transition: width 0.4s ease;"></div>
        </div>
        <div id="optLogList" class="border rounded p-3 bg-light"></div>
        <div class="mt-3 text-success fw-bold fs-5" id="finishTip"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('startOptimizeBtn').addEventListener('click', function(){
    const optArea = document.getElementById('optArea');
    const progressBar = document.getElementById('optProgress');
    const logList = document.getElementById('optLogList');
    const finishTip = document.getElementById('finishTip');

    // 重置状态
    optArea.classList.remove('d-none');
    progressBar.style.width = '0%';
    logList.innerHTML = '';
    finishTip.innerText = '';
    progressBar.className = 'progress-bar progress-bar-striped progress-bar-animated bg-warning';

    // 已替换为你要的最新内容
    const steps = [
        {text:"中间表示与约束规则库已优化完成", percent:25},
        {text:"动态智能体FM约束生成器已优化完成", percent:50},
        {text:"智能体运行时安全SMT求解器已优化完成", percent:75},
        {text:"检测速度与准确率提升完成", percent:100}
    ];

    let idx = 0;
    function nextStep(){
        if(idx >= steps.length){
            // 进度条完成变绿色
            progressBar.classList.remove('bg-warning');
            progressBar.classList.add('bg-success');
            const now = new Date();
            const dateStr = now.toLocaleString('zh-CN');
            finishTip.innerText = `已优化完成，完成时间：${dateStr}`;
            return;
        }
        const step = steps[idx];
        progressBar.style.width = step.percent + '%';
        
        const item = document.createElement('div');
        item.className = 'text-dark mb-2 animate__fadeIn';
        item.style.opacity = '0';
        item.style.transition = 'opacity 0.3s ease';
        setTimeout(()=> item.style.opacity = '1', 50);

        // 图标 + 状态标签，增强视觉
        item.innerHTML = `
            <span class="text-success fs-5 me-2">✔</span>
            <span class="badge bg-success-subtle text-success me-2">已完成</span>
            ${step.text}
        `;
        logList.appendChild(item);
        idx++;
        setTimeout(nextStep, 800);
    }
    setTimeout(nextStep, 300);
});
</script>
{% endblock %}
